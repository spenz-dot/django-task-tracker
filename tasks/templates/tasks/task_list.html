<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Tasks</title>
</head>
<body>
<h1>My Tasks</h1>

  <form method="post">
    {% csrf_token %}
    <input type="text" name="title" placeholder="New task" required>
    <button type="submit">Add</button>
  </form>

  <ul>
    {% for task in tasks %}
      <li>
        <form method="post" action="{% url 'toggle_task' task.id %}" style="display:inline">
          {% csrf_token %}
          <button type="submit">{% if task.done %}Undo{% else %}Done{% endif %}</button>
        </form>
        {% if task.done %}<s>{{ task.title }}</s>{% else %}{{ task.title }}{% endif %}
      </li>
    {% empty %}
      <li>No tasks yet.</li>
    {% endfor %}
  </ul>
</body>
</html>
